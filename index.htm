<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Logiciel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(160deg, #f8fafc 0%, #e8eef6 100%);
    }

    .logo {
      width: 100%;
      max-width: 220px;
      height: auto;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #0f2a4a;
      margin-bottom: 12px;
    }

    p {
      max-width: 520px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #4b5563;
    }

    footer {
      position: absolute;
      bottom: 16px;
      font-size: 0.85rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <img class="logo" src="logo.png" alt="Logo du logiciel">

  <h1>Bienvenue</h1>
  <p>Votre texte de présentation ici : une courte description de votre logiciel, simple et claire.</p>

  <footer>&copy; 2026 Mon Logiciel. Tous droits réservés.</footer>

</body>
</html>
